services:
  postgres:
    image: postgres:15-alpine
    container_name: sos_postgres
    environment:
      POSTGRES_USER: sos_user
      POSTGRES_PASSWORD: sos_password
      POSTGRES_DB: sos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sos_user -d sos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: sos_mqtt_broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sos_backend
    environment:
      - DATABASE_URL=postgresql://sos_user:sos_password@postgres:5432/sos_db
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      mqtt-broker:
        condition: service_started

  digital-twin:
    build:
      context: ./digital-twin
      dockerfile: Dockerfile
    container_name: sos_digital_twin
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - BACKEND_URL=http://backend:8000/api
    volumes:
      - ./digital-twin:/app
    depends_on:
      - backend
      - mqtt-broker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sos_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
